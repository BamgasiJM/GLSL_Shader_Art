<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Artwork</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="webgl_canvas"></canvas>
        <h1 class="title">Shader Artwork</h1>
        <div id="controls" class="controls">
            <div class="control-group">
                <label for="dissipationSlider">감쇠 (Dissipation): <span id="dissipationValue">0.899</span></label>
                <input type="range" id="dissipationSlider" min="0.8" max="0.999" step="0.001" value="0.899">
            </div>
            <div class="control-group">
                <label for="advectScaleSlider">이송 강도 (Advect Scale): <span id="advectScaleValue">10.0</span></label>
                <input type="range" id="advectScaleSlider" min="0" max="20" step="0.1" value="10.0">
            </div>
            <div class="control-group">
                <label for="splatRadiusSlider">스플랫 반경 (Splat Radius): <span id="splatRadiusValue">0.001</span></label>
                <input type="range" id="splatRadiusSlider" min="0.0001" max="0.02" step="0.0001" value="0.001">
            </div>
            <div class="control-group">
                <label for="splatStrengthSlider">스플랫 강도 (Splat Strength): <span id="splatStrengthValue">1.2</span></label>
                <input type="range" id="splatStrengthSlider" min="0" max="3" step="0.01" value="1.2">
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
